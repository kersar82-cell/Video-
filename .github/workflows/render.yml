name: Unzip and Render Remotion Video

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Unzip project file
        run: |
          # এখানে আপনার জিপ ফাইলটির নাম দিতে হবে (যেমন আপনার ফাইলের নাম w1last_project.zip হলে সেটি লিখবেন)
          unzip -q w1last_project.zip -d project_folder

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: project_folder/package.json

      - name: Install dependencies
        working-directory: ./project_folder
        run: npm install

      - name: Render video
        working-directory: ./project_folder
        run: npx remotion render Main out/video.mp4

      - name: Upload rendered video
        uses: actions/upload-artifact@v4
        with:
          name: video-artifact
          path: project_folder/out/video.mp4
          
